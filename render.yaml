services:
  - type: web
    name: obeconbot-core
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /readyz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TELEGRAM_RUNTIME_ENABLED
        value: "1"
      - key: KEEPALIVE_ENABLED
        value: "1"
      - key: TELEGRAM_AUTH_REQUIRED
        value: "1"
      - key: TELEGRAM_INIT_DATA_MAX_AGE_SECONDS
        value: "3600"
      - key: TELEGRAM_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: BASE_URL
        sync: false
      - key: MINIAPP_URL
        sync: false
      - key: API_CORS_ORIGINS
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: UPSTASH_STATE_KEY
        value: bot-econ-state
      - key: DATABASE_URL
        value: sqlite:///./data/obeconbot.db
      - key: SIGNAL_MIN_SCORE
        value: "70"
      - key: LEGACY_LIVE_FETCH_ENABLED
        value: "1"

  - type: static
    name: obeconbot-miniapp
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20.19.5"
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_MINIAPP_ENV
        value: production
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
